name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  test:
    name: Tests on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig version
      - run: zig env
      - run: ls
      - run: ls zig-cache || echo 'no zig-cache'
      - name: Build
        run: zig build --verbose
      - name: Run Tests
        run: zig build test
      - name: Run Tests (uucode backend)
        run: zig build test -Dunicode_backend=uucode
      - name: Run Examples
        run: zig build examples
      - name: Build External ZG Consumer
        working-directory: examples/external-zg
        run: zig build
      - name: Build External Uucode Consumer
        working-directory: examples/external-uucode
        run: zig build
